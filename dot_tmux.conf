set-option -g history-limit 100000
set -g mouse on

# ─────────────────────────────────────────────
# Appearance only — don't mess with behavior
# ─────────────────────────────────────────────

set -g status on
set -g status-position bottom
set -g status-interval 5

# Let true color through
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# Overall bar
set -g status-style "bg=#003847,fg=#c0caf5"

# LEFT: session
set -g status-left-length 60
set -g status-left "#[bg=#c0caf5,fg=#1a1b26,bold] #S #[bg=#003847,fg=#c0caf5]"

# WINDOWS
setw -g window-status-format "#[fg=#a9b1d6,bg=#003847] #I #W "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#c0caf5,bold] #I #W #[fg=#c0caf5,bg=#003847]"

# RIGHT: hostname
set -g status-right-length 80
set -g status-right "#[fg=#c0caf5,bg=#003847]#[fg=#1a1b26,bg=#c0caf5,bold] #H "
