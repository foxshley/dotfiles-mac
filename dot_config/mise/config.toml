# Personal runtime defaults. Node follows the latest LTS line.
# Mise owns Python versions; uv owns project environments and packages.
# Run `mise upgrade node` when updating the default; avoid a global Node lock.
# Older project-specific Node versions are not part of the bootstrap.

[tools]
node = "lts"
python = "3.14"
ruby = "3.4"
bun = "1.3.14"
go = "1.26.5"
# Homebrew reports 0.16.0_1; its packaging revision is not an upstream version.
zig = "0.16.0"
rust = "latest"

[env]
# Point uv at the interpreter selected by mise, including project overrides.
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[settings]
# Preserve discovery of Node, Python, and Rust project version files.
idiomatic_version_file_enable_tools = ["node", "python", "rust"]
# Preserve Go's usual GOBIN behavior; verify ~/go/bin is on the intended PATH.
go.set_gobin = false
